      # Environmental impact estimate
      - type: markdown
        content: |
          ### 🌱 Environmental Impact
          
          Based on your solar generation, you've offset approximately:
          - **CO₂ Avoided**: ~0.4 kg per kWh of solar
          - **Trees Equivalent**: ~1 tree per 20 kWh/year
          
          *Values are estimates based on US average grid emissions*

      # Note about lifetime tracking
      - type: markdown
        content: |
          ### ℹ️ About Lifetime Tracking
          
          The lifetime meters use **yearly** reset cycle as a practical proxy.
          They will accumulate throughout the year and reset on January 1st.
          
          For true all-time totals, check your:
          - **Tesla app** for Powerwall lifetime stats
          - **Emporia app** for device lifetime usage
          
          Home Assistant's long-term statistics also store historical data
          that can be queried for true lifetime totals.
