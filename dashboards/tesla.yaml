title: Tesla Energy
views:
  - title: Today
    path: today
    icon: mdi:calendar-today
    cards:
      - type: custom:power-flow-card-plus
        entities:
          grid:
            entity: sensor.west_sacramento_grid_power
            name: Grid
          solar:
            entity: sensor.west_sacramento_solar_power
            name: Solar
          battery:
            entity: sensor.west_sacramento_battery_power
            name: Powerwall
            state_of_charge: sensor.west_sacramento_percentage_charged
          home:
            entity: sensor.west_sacramento_load_power
            name: Home
        watt_threshold: 1000
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.west_sacramento_solar_generated
            name: Solar Today
          - type: entity
            entity: sensor.west_sacramento_home_usage
            name: Home Usage
          - type: entity
            entity: sensor.west_sacramento_grid_imported
            name: Grid Import
      - type: custom:apexcharts-card
        header:
          title: Today's Energy Sources
          show: true
        chart_type: donut
        series:
          - entity: sensor.west_sacramento_consumer_imported_from_solar
            name: Solar
            color: '#FFB800'
          - entity: sensor.west_sacramento_consumer_imported_from_battery
            name: Battery
            color: '#00C853'
          - entity: sensor.west_sacramento_consumer_imported_from_grid
            name: Grid
            color: '#607D8B'
      - type: custom:mini-graph-card
        name: Battery Level (24h)
        entities:
          - entity: sensor.west_sacramento_percentage_charged
            color: '#00C853'
        hours_to_show: 24
        line_width: 2
        show:
          fill: gradient
  - title: Week
    path: week
    icon: mdi:calendar-week
    cards:
      - type: custom:mini-graph-card
        name: Home Load (7 Days)
        entities:
          - entity: sensor.west_sacramento_load_power
            color: '#2196F3'
        hours_to_show: 168
        line_width: 2
        points_per_hour: 0.5
        show:
          fill: gradient
      - type: custom:mini-graph-card
        name: Solar Power (7 Days)
        entities:
          - entity: sensor.west_sacramento_solar_power
            color: '#FFB800'
        hours_to_show: 168
        line_width: 2
        points_per_hour: 0.5
        show:
          fill: gradient
      - type: custom:mini-graph-card
        name: Battery Level (7 Days)
        entities:
          - entity: sensor.west_sacramento_percentage_charged
            color: '#00C853'
        hours_to_show: 168
        line_width: 2
        points_per_hour: 0.5
        show:
          fill: gradient
      - type: custom:mini-graph-card
        name: Grid Power (7 Days)
        entities:
          - entity: sensor.west_sacramento_grid_power
            color: '#607D8B'
        hours_to_show: 168
        line_width: 2
        points_per_hour: 0.5
        show:
          fill: gradient
  - title: Month
    path: month
    icon: mdi:calendar-month
    cards:
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.solar_energy_this_month
            name: Solar This Month
            icon: mdi:solar-power
          - type: entity
            entity: sensor.totalusage_energy_this_month
            name: Usage This Month
            icon: mdi:home-lightning-bolt
          - type: entity
            entity: sensor.mainsfromgrid_energy_this_month
            name: Grid Import
            icon: mdi:transmission-tower
      - type: custom:mini-graph-card
        name: Home Load (30 Days)
        entities:
          - entity: sensor.west_sacramento_load_power
            color: '#2196F3'
        hours_to_show: 720
        line_width: 1
        points_per_hour: 0.1
        show:
          fill: gradient
      - type: custom:mini-graph-card
        name: Solar Power (30 Days)
        entities:
          - entity: sensor.west_sacramento_solar_power
            color: '#FFB800'
        hours_to_show: 720
        line_width: 1
        points_per_hour: 0.1
        show:
          fill: gradient
      - type: custom:apexcharts-card
        header:
          title: Top Consumers This Month
          show: true
        chart_type: donut
        series:
          - entity: sensor.lg_main_energy_this_month
            name: HVAC Main
            color: '#F44336'
          - entity: sensor.subpanel_energy_this_month
            name: Laundry
            color: '#E91E63'
          - entity: sensor.lg_mini_energy_this_month
            name: HVAC Mini
            color: '#9C27B0'
          - entity: sensor.office_os_guest_bath_energy_this_month
            name: Office
            color: '#673AB7'
          - entity: sensor.refrigerator_energy_this_month
            name: Refrigerator
            color: '#00BCD4'
  - title: Year
    path: year
    icon: mdi:calendar
    cards:
      - type: markdown
        content: |
          ## Yearly Statistics
          Long-term statistics from Home Assistant's recorder.
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.west_sacramento_home_usage
            name: Home Usage Total
          - type: entity
            entity: sensor.west_sacramento_solar_generated
            name: Solar Generated Total
          - type: entity
            entity: sensor.west_sacramento_grid_imported
            name: Grid Import Total
      - type: history-graph
        title: Home Usage History
        hours_to_show: 168
        entities:
          - entity: sensor.west_sacramento_load_power
            name: Home Load
      - type: history-graph
        title: Solar Production History
        hours_to_show: 168
        entities:
          - entity: sensor.west_sacramento_solar_power
            name: Solar
  - title: Lifetime
    path: lifetime
    icon: mdi:infinity
    cards:
      - type: markdown
        content: |
          ## Lifetime Energy Statistics
          Cumulative totals since system installation.
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.west_sacramento_home_usage
            name: Total Home Usage
            icon: mdi:home-lightning-bolt
          - type: entity
            entity: sensor.west_sacramento_solar_generated
            name: Total Solar
            icon: mdi:solar-power
          - type: entity
            entity: sensor.west_sacramento_grid_imported
            name: Total Grid Import
            icon: mdi:transmission-tower
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.west_sacramento_grid_exported
            name: Total Export
            icon: mdi:transmission-tower-export
          - type: entity
            entity: sensor.west_sacramento_battery_charged
            name: Total Charged
            icon: mdi:battery-plus
          - type: entity
            entity: sensor.west_sacramento_battery_discharged
            name: Total Discharged
            icon: mdi:battery-minus
  - title: Battery
    path: battery
    icon: mdi:battery-charging
    cards:
      - type: custom:mini-graph-card
        name: Battery State of Charge
        entities:
          - entity: sensor.west_sacramento_percentage_charged
            color: '#00C853'
        hours_to_show: 48
        line_width: 3
        font_size: 100
        show:
          labels: true
          state: true
          fill: gradient
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.west_sacramento_battery_charged
            name: Charged Today
            icon: mdi:battery-plus
          - type: entity
            entity: sensor.west_sacramento_battery_discharged
            name: Discharged Today
            icon: mdi:battery-minus
      - type: custom:apexcharts-card
        header:
          title: Battery Charge Sources
          show: true
        chart_type: donut
        series:
          - entity: sensor.west_sacramento_battery_imported_from_solar
            name: From Solar
            color: '#FFB800'
          - entity: sensor.west_sacramento_battery_imported_from_grid
            name: From Grid
            color: '#607D8B'
  # Energy Flow Sankey Chart View
  - title: Flow
    path: flow
    icon: mdi:chart-sankey
    cards:
      # Real-time power flow using Emporia sensors (all in Watts)
      - type: custom:sankey-chart
        show_names: true
        show_icons: true
        show_units: true
        show_states: true
        wide: true
        height: 500
        min_box_height: 3
        min_box_distance: 5
        sections:
          # Section 1: Energy Sources
          - entities:
              - entity_id: sensor.solar_power_minute_average
                name: ☀️ Solar
                color: '#FFB800'
                children:
                  - sensor.totalusage_power_minute_average
              - entity_id: sensor.powerwall_power_minute_average
                name: 🔋 Battery
                color: '#00C853'
                children:
                  - sensor.totalusage_power_minute_average
          # Section 2: Total Home Consumption
          - entities:
              - entity_id: sensor.totalusage_power_minute_average
                name: 🏠 Home
                color: '#2196F3'
                children:
                  - sensor.lg_main_power_minute_average
                  - sensor.lg_mini_power_minute_average
                  - sensor.refrigerator_power_minute_average
                  - sensor.guest_bed_o_l_main_bed_o_power_minute_average
                  - sensor.living_room_lights_and_outlet_power_minute_average
                  - sensor.office_os_guest_bath_power_minute_average
                  - sensor.water_filters_power_minute_average
                  - sensor.dining_laundry_room_lights_power_minute_average
                  - sensor.balance_power_minute_average
          # Section 3: Individual Consumers
          - entities:
              - entity_id: sensor.lg_main_power_minute_average
                name: HVAC Main
                color: '#F44336'
              - entity_id: sensor.lg_mini_power_minute_average
                name: Mini Split
                color: '#E91E63'
              - entity_id: sensor.refrigerator_power_minute_average
                name: Fridge
                color: '#4CAF50'
              - entity_id: sensor.guest_bed_o_l_main_bed_o_power_minute_average
                name: Bedrooms
                color: '#9C27B0'
              - entity_id: sensor.living_room_lights_and_outlet_power_minute_average
                name: Living Room
                color: '#03A9F4'
              - entity_id: sensor.office_os_guest_bath_power_minute_average
                name: Office
                color: '#673AB7'
              - entity_id: sensor.water_filters_power_minute_average
                name: Water Filters
                color: '#00BCD4'
              - entity_id: sensor.dining_laundry_room_lights_power_minute_average
                name: Dining
                color: '#FFC107'
              - entity_id: sensor.balance_power_minute_average
                name: Other
                color: '#9E9E9E'

      # Helpful context card
      - type: markdown
        content: |
          **Real-time Power Flow** showing where your electricity is going right now.
          - ☀️ **Solar**: Power from solar panels
          - 🔋 **Battery**: Powerwall discharge  
          - 🏠 **Home**: Total consumption flowing to devices

      # Tesla system overview with kW values
      - type: custom:sankey-chart
        title: Tesla System Flow (kW)
        show_names: true
        show_states: true
        show_units: true
        unit_prefix: k
        height: 300
        min_box_height: 3
        sections:
          - entities:
              - entity_id: sensor.west_sacramento_solar_power
                name: Solar
                color: '#FFB800'
                children:
                  - sensor.west_sacramento_load_power
                  - sensor.west_sacramento_battery_power
              - entity_id: sensor.west_sacramento_grid_power
                name: Grid
                color: '#607D8B'
                children:
                  - sensor.west_sacramento_load_power
          - entities:
              - entity_id: sensor.west_sacramento_load_power
                name: Home
                color: '#2196F3'
              - entity_id: sensor.west_sacramento_battery_power
                name: Battery
                color: '#00C853'

