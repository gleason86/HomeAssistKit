          - entity: sensor.guest_bed_o_l_main_bed_o_energy_this_month
            name: Bedrooms
            color: '#9C27B0'
          - entity: sensor.refrigerator_energy_this_month
            name: Refrigerator
            color: '#4CAF50'
          - entity: sensor.water_filters_energy_this_month
            name: Water Filters
            color: '#00BCD4'
          - entity: sensor.water_heater_energy_this_month_2
            name: Water Heater
            color: '#FF9800'
          - entity: sensor.ev_charger_energy_this_month
            name: EV Charger
            color: '#8BC34A'
          - entity: sensor.dryer_energy_this_month
            name: Dryer
            color: '#795548'
          - entity: sensor.balance_energy_this_month
            name: Untracked
            color: '#9E9E9E'

      # Device table - Monthly
      - type: entities
        title: All Devices (kWh This Month)
        show_header_toggle: false
        entities:
          - entity: sensor.lg_main_energy_this_month
            name: 🌡️ HVAC Main
          - entity: sensor.lg_mini_energy_this_month
            name: 🌡️ Mini Split
          - entity: sensor.office_os_guest_bath_energy_this_month
            name: 💼 Office/Guest Bath
          - entity: sensor.living_room_lights_and_outlet_energy_this_month
            name: 🛋️ Living Room
          - entity: sensor.guest_bed_o_l_main_bed_o_energy_this_month
            name: 🛏️ Bedrooms
          - entity: sensor.refrigerator_energy_this_month
            name: 🍳 Refrigerator
          - entity: sensor.water_filters_energy_this_month
            name: 💧 Water Filters
          - entity: sensor.dining_laundry_room_lights_energy_this_month
            name: 🍽️ Dining/Laundry
          - entity: sensor.water_heater_energy_this_month_2
            name: 🚿 Water Heater
          - entity: sensor.ev_charger_energy_this_month
            name: 🔌 EV Charger
          - entity: sensor.garage_entry_and_pantry_energy_this_month
            name: 🚗 Garage/Pantry
          - entity: sensor.dryer_energy_this_month
            name: 👕 Dryer
          - entity: sensor.dishwasher_energy_this_month
            name: 🍽️ Dishwasher
          - entity: sensor.balance_energy_this_month
            name: ❓ Untracked
            icon: mdi:help-circle

      # Daily trend for the month
      - type: custom:apexcharts-card
        header:
          title: Daily Usage This Month
          show: true
        graph_span: 30d
        span:
          end: day
        apex_config:
          chart:
            height: 250
          xaxis:
            labels:
              format: MMM dd
        series:
          - entity: sensor.totalusage_energy_today
            type: column
            name: Daily Usage
            color: '#2196F3'
            group_by:
              func: max
              duration: 1d

  # ══════════════════════════════════════════════════════════════
  # THIS WEEK SUMMARY (requires utility meters after HA restart)
  # ══════════════════════════════════════════════════════════════
  - title: 📊 Week
    path: summary-week
    icon: mdi:calendar-week
    cards:
      # Top stats row - Weekly totals
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.home_usage_weekly
            name: Home Usage
            icon: mdi:home-lightning-bolt
          - type: entity
            entity: sensor.solar_generated_weekly
            name: Solar
            icon: mdi:solar-power
          - type: entity
            entity: sensor.grid_imported_weekly
            name: From Grid
            icon: mdi:transmission-tower
          - type: entity
            entity: sensor.grid_exported_weekly
            name: To Grid
            icon: mdi:transmission-tower-export

      # Energy sources this week
      - type: custom:apexcharts-card
        header:
          title: This Week's Energy Sources
          show: true
        chart_type: donut
        apex_config:
          chart:
            height: 300
          legend:
            show: true
            position: right
          tooltip:
            y:
              formatter: |
                EVAL:function(val) { return val.toFixed(1) + ' kWh' }
          plotOptions:
            pie:
              donut:
                size: '60%'
                labels:
                  show: true
                  total:
                    show: true
                    label: Total
                    formatter: |
                      EVAL:function(w) {
                        return w.globals.seriesTotals.reduce((a, b) => a + b, 0).toFixed(1) + ' kWh'
                      }
        series:
          - entity: sensor.consumer_from_solar_weekly
            name: From Solar
            color: '#FFB800'
          - entity: sensor.consumer_from_battery_weekly
            name: From Battery
            color: '#00C853'
          - entity: sensor.consumer_from_grid_weekly
            name: From Grid
            color: '#607D8B'

      # Battery stats this week
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.battery_charged_weekly
            name: Battery Charged
            icon: mdi:battery-charging
          - type: entity
            entity: sensor.battery_discharged_weekly
            name: Battery Used
            icon: mdi:battery-arrow-down

      # 7-day trend
      - type: custom:apexcharts-card
        header:
          title: Daily Usage (Past 7 Days)
          show: true
        graph_span: 7d
        span:
          end: day
        apex_config:
          chart:
            height: 250
          xaxis:
            labels:
              format: ddd
        series:
          - entity: sensor.totalusage_energy_today
            type: column
            name: Daily Usage
            color: '#2196F3'
            group_by:
              func: max
              duration: 1d
          - entity: sensor.solar_energy_today
            type: column
            name: Solar Generated
            color: '#FFB800'
            group_by:
              func: max
              duration: 1d

