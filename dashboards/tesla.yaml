            type: column
            name: Home Usage
            color: '#2196F3'
            group_by:
              func: delta
              duration: 1month
          - entity: sensor.west_sacramento_solar_generated
            type: column
            name: Solar
            color: '#FFB800'
            group_by:
              func: delta
              duration: 1month

      # Yearly stats
      - type: markdown
        content: |
          ### 📊 Year Stats
          - **Net Energy**: Grid Import - Grid Export
          - **Self-Sufficiency**: % of energy from Solar + Battery
          - **Grid Independence**: Lower = more self-sufficient

