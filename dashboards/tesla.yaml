  # ══════════════════════════════════════════════════════════════
  # TODAY SUMMARY
  # ══════════════════════════════════════════════════════════════
  - title: 📅 Today
    path: summary-today
    icon: mdi:calendar-today
    cards:
      # Top stats row
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.totalusage_energy_today
            name: Home Usage
            icon: mdi:home-lightning-bolt
          - type: entity
            entity: sensor.solar_energy_today
            name: Solar
            icon: mdi:solar-power
          - type: entity
            entity: sensor.mainsfromgrid_energy_today
            name: From Grid
            icon: mdi:transmission-tower
          - type: entity
            entity: sensor.west_sacramento_percentage_charged
            name: Battery
            icon: mdi:battery

      # Donut chart
      - type: custom:apexcharts-card
        header:
          title: Today's Energy Distribution
          show: true
        chart_type: donut
        apex_config:
          chart:
            height: 350
          legend:
            show: true
            position: right
            fontSize: '14px'
          tooltip:
            y:
              formatter: |
                EVAL:function(val) { return val.toFixed(1) + ' kWh' }
          dataLabels:
            formatter: |
              EVAL:function(val) { return val.toFixed(0) + '%' }
          plotOptions:
            pie:
              donut:
                size: '60%'
                labels:
                  show: true
                  name:
                    show: true
                    fontSize: '14px'
                  value:
                    show: true
                    fontSize: '20px'
                    formatter: |
                      EVAL:function(val) { return parseFloat(val).toFixed(1) + ' kWh' }
                  total:
                    show: true
                    label: Total
                    fontSize: '14px'
                    formatter: |
                      EVAL:function(w) {
                        return w.globals.seriesTotals.reduce((a, b) => a + b, 0).toFixed(1) + ' kWh'
                      }
        series:
          - entity: sensor.lg_main_energy_today
            name: HVAC Main
            color: '#F44336'
          - entity: sensor.lg_mini_energy_today
            name: Mini Split
            color: '#E91E63'
          - entity: sensor.office_os_guest_bath_energy_today
            name: Office/Guest
            color: '#673AB7'
          - entity: sensor.living_room_lights_and_outlet_energy_today
            name: Living Room
            color: '#2196F3'
          - entity: sensor.guest_bed_o_l_main_bed_o_energy_today
            name: Bedrooms
            color: '#9C27B0'
          - entity: sensor.refrigerator_energy_today
            name: Refrigerator
            color: '#4CAF50'
          - entity: sensor.water_filters_energy_today
            name: Water Filters
            color: '#00BCD4'
          - entity: sensor.water_heater_energy_today_2
            name: Water Heater
            color: '#FF9800'
          - entity: sensor.ev_charger_energy_today
            name: EV Charger
            color: '#8BC34A'
          - entity: sensor.balance_energy_today
            name: Untracked
            color: '#9E9E9E'

      # Device table
      - type: entities
        title: All Devices (kWh Today)
        show_header_toggle: false
        entities:
          - entity: sensor.lg_main_energy_today
            name: 🌡️ HVAC Main
          - entity: sensor.lg_mini_energy_today
            name: 🌡️ Mini Split
          - entity: sensor.office_os_guest_bath_energy_today
            name: 💼 Office/Guest Bath
          - entity: sensor.living_room_lights_and_outlet_energy_today
            name: 🛋️ Living Room
          - entity: sensor.guest_bed_o_l_main_bed_o_energy_today
            name: 🛏️ Bedrooms
          - entity: sensor.refrigerator_energy_today
            name: 🍳 Refrigerator
          - entity: sensor.water_filters_energy_today
            name: 💧 Water Filters
          - entity: sensor.dining_laundry_room_lights_energy_today
            name: 🍽️ Dining/Laundry
          - entity: sensor.water_heater_energy_today_2
            name: 🚿 Water Heater
          - entity: sensor.ev_charger_energy_today
            name: 🔌 EV Charger
          - entity: sensor.garage_entry_and_pantry_energy_today
