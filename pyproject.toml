[project]
name = "ha-brain"
version = "0.1.0"
description = "Home Assistant configuration, custom integrations, and agent orchestration"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.25.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",  # Parallel test execution
    # Linting & Formatting
    "ruff>=0.8.0",
    # Type Checking
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    # Pre-commit hooks
    "pre-commit>=3.5.0",
    # YAML validation
    "yamllint>=1.32.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "integrations*"]
exclude = ["homeassistant-config*", "credentials*"]

# ============================================================================
# Ruff - Fast Python linter and formatter (replaces black, isort, flake8)
# ============================================================================
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "homeassistant-config",  # Read-only sync from HA instance
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
# Home Assistant integrations use runtime imports that look like type-only imports
"integrations/**/custom_components/**" = ["TC002", "ARG001", "ERA001"]
# MCP server patterns
"agents/**/server.py" = ["PLW0603", "PLR0911"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "integrations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# Mypy - Static type checking
# ============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = false  # Start with this off, enable as you add types
show_error_codes = true
exclude = [
    "homeassistant-config",  # Read-only sync from HA instance
    ".venv",
    "build",
]

[[tool.mypy.overrides]]
module = [
    "mcp.*",
    "websockets.*",
]
ignore_missing_imports = true

# ============================================================================
# Pytest - Testing framework
# ============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",                    # Show extra test summary for all except passed
    "-q",                     # Quiet output
    "--strict-markers",       # Unknown markers are errors
    "--strict-config",        # Invalid config values are errors
    "-x",                     # Stop on first failure
    "--tb=short",             # Shorter traceback format
]
testpaths = ["tests", "agents/mcp_ha_server/tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services",
]

# ============================================================================
# Coverage - Test coverage reporting
# ============================================================================
[tool.coverage.run]
source = ["agents", "integrations"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

# ============================================================================
# Yamllint - YAML validation
# ============================================================================
# Note: yamllint config is in .yamllint.yaml
